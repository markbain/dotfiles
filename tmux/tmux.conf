# Colour depth — tmux 3.0a defaults TERM to "screen", which declares 8 colours.
# Claude Code and anything else using a 256-colour palette then collapses its
# greys and dim text onto the nearest of 8, and some of it becomes unreadable.
# The Tc override passes truecolour through from the outer terminal.
set  -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g bell-action any
set -g visual-bell off

# Mouse support — selection stays within one pane, not across boundaries
set -g mouse on

# Vi keys in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'

# Paste through tmux buffer with bracketed paste — prevents multiline commands
# from executing line-by-line (tmux 3.0a strips bracketed paste on right-click paste;
# this re-wraps the paste so zsh sees it as one atomic unit)
bind p paste-buffer -p

# Working directory in the status bar — session path is the one new panes
# inherit, pane path is where that shell actually is
set -g status-right ' S:#{=-30:session_path} | P:#{=-30:pane_current_path} '
set -g status-right-length 70

# Status bar colours. tmux 3.8 defaults to bg=themegreen, which resolves to
# yellowgreen on a 256-colour client - a bright band across the bottom of every
# window. bg=default takes the terminal's own background instead, so the bar
# belongs to whichever Terminator profile the pane uses and inherits its
# transparency if that is ever turned on. themelightgrey is gray70: contrast
# against the 17 profile backgrounds runs 5.2:1 to 8.8:1, AA on all of them,
# and the theme name (rather than a hex) flips correctly if a client ever
# reports a light background.
set -g status-style bg=default,fg=themelightgrey

# New windows and panes open in the current pane's directory rather than
# the session's — tmux 1.9+ defaults to the session path otherwise
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# Pane menus (prefix + > and Alt-right-click) — same current-path
# behaviour for their Horizontal/Vertical Split entries. Labels name the
# divider line: Horizontal = top/bottom (-v), Vertical = side by side (-h),
# the reverse of tmux's own flag naming
bind-key -T prefix > display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -x P -y P "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r "copy-mode -t=; send -Xt= search-backward \"#{q:mouse_word}\"" "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y "send-keys -l -- \"#{q:mouse_word}\"" "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c "set-buffer -- \"#{q:mouse_word}\"" "#{?mouse_line,Copy Line,}" l "set-buffer -- \"#{q:mouse_line}\""  "Horizontal Split" h "split-window -v -c \"#{pane_current_path}\"" "Vertical Split" v "split-window -h -c \"#{pane_current_path}\""  "Swap Up" u "swap-pane -U" "Swap Down" d "swap-pane -D" "#{?pane_marked_set,,-}Swap Marked" s swap-pane  Kill X kill-pane Respawn R "respawn-pane -k" "#{?pane_marked,Unmark,Mark}" m "select-pane -m" "#{?window_zoomed_flag,Unzoom,Zoom}" z "resize-pane -Z"
bind-key -T root M-MouseDown3Pane display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r "copy-mode -t=; send -Xt= search-backward \"#{q:mouse_word}\"" "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y "send-keys -l -- \"#{q:mouse_word}\"" "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c "set-buffer -- \"#{q:mouse_word}\"" "#{?mouse_line,Copy Line,}" l "set-buffer -- \"#{q:mouse_line}\""  "Horizontal Split" h "split-window -v -c \"#{pane_current_path}\"" "Vertical Split" v "split-window -h -c \"#{pane_current_path}\""  "Swap Up" u "swap-pane -U" "Swap Down" d "swap-pane -D" "#{?pane_marked_set,,-}Swap Marked" s swap-pane  Kill X kill-pane Respawn R "respawn-pane -k" "#{?pane_marked,Unmark,Mark}" m "select-pane -m" "#{?window_zoomed_flag,Unzoom,Zoom}" z "resize-pane -Z"

# --- Plugins (TPM). prefix + I installs new ones, prefix + U updates.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save sessions every 5 minutes and restore them automatically when the server starts.
# Manual: prefix + Ctrl-s saves, prefix + Ctrl-r restores.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Keep this line at the very bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
